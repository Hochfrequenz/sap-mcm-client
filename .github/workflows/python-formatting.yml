name: "Python Formatting"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  format:
    name: "format (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Both tools were replaced by ruff. The `tool` values and this
          # job's name are kept as-is because they are pinned as required
          # status checks in the branch ruleset; only the command each one
          # runs underneath has changed.
          - tool: "black"
            command: "uv run ruff format --check ."
          - tool: "isort"
            command: "uv run ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: ${{ matrix.command }}
