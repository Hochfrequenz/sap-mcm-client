name: "Python Lint"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pylint:
    name: "Python Code Quality and Lint (${{ matrix.linter-env }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Install Dependencies
        run: uv sync --group ${{ matrix.linter-env }}
      - name: Run ${{ matrix.linter-env }}
        run: |
          case "${{ matrix.linter-env }}" in
            linting)
              uv run pylint sap_mcm_client
              uv run pylint unittests --rcfile=unittests/.pylintrc
              ;;
            type_check)
              uv run mypy --show-error-codes src/sap_mcm_client --strict
              uv run mypy --show-error-codes unittests --strict
              ;;
            spell_check)
              uv run codespell --ignore-words=domain-specific-terms.txt src
              uv run codespell --ignore-words=domain-specific-terms.txt README.md
              ;;
            *)
              echo "Unknown linter-env: ${{ matrix.linter-env }}" >&2
              exit 1
              ;;
          esac
