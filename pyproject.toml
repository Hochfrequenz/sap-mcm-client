[project]
name = "sap-mcm-client"
description = "Typed Python client for the SAP Cloud for Utilities Foundation Measurement Concept Management (MCM) APIs"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["sap", "mcm", "odata", "utilities", "measurement-concept"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2",
    # Upper bound is a test-tooling constraint, not a library one: the
    # aioresponses mock (used in the unit tests) does not yet support
    # aiohttp 3.14's ClientResponse signature (missing stream_writer arg).
    # Tracking: https://github.com/pnuckowski/aioresponses/issues/289
    # Lift once aioresponses releases aiohttp 3.14 compatibility.
    "aiohttp>=3.9,<3.14",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/sap-mcm-client/releases"
Homepage = "https://github.com/Hochfrequenz/sap-mcm-client"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aioresponses==0.7.9",
]
linting = [
    "ruff==0.16.2",
    { include-group = "tests" },
]
type_check = [
    "mypy==2.3.0",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.15.4",
    { include-group = "tests" },
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" },
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "E501", # line-too-long (explicitly disabled in both old pylint configs)
    "PLR0904", # too-many-public-methods (never enforced by the old pylint config)
    "PLR0911", # too-many-return-statements (never enforced by the old pylint config)
    "PLR0912", # too-many-branches (never enforced by the old pylint config)
    "PLR0913", # too-many-arguments (explicitly disabled in the old pylint config)
    "PLR0915", # too-many-statements (never enforced by the old pylint config)
    "PLR0917", # too-many-positional-arguments (explicitly disabled in the old pylint config)
    "PLR2004", # magic-value-comparison (never enforced by the old pylint config)
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF022", # unsorted-dunder-all (this repo hand-groups __all__ by category, not alphabetically)
]

[tool.ruff.lint.per-file-ignores]
# unittests/.pylintrc explicitly disabled import-outside-toplevel for this
# directory only (src/ never had it disabled).
"unittests/**" = ["PLC0415"]

[tool.pytest.ini_options]
# pytest-asyncio in "auto" mode treats every ``async def test_*`` as an
# asyncio test, so individual tests need no ``@pytest.mark.asyncio`` marker.
asyncio_mode = "auto"

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# aioresponses ships no type stubs and is not PEP 561 typed.
module = ["aioresponses.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_sap_mcm_client_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
# Never ship the SAP OpenAPI specs (SAP IP, not redistributable). They are
# git-ignored and not committed, but exclude them defensively so a locally
# downloaded copy can never end up in a published source distribution.
exclude = ["/unittests", "/specs"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
